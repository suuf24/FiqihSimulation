*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}.sidebar{width:270px;background:#fffdf7;border-right:1px solid var(--line);padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(0);transition:.25s ease;box-shadow:var(--shadow);overflow:auto}.sidebar.hidden{transform:translateX(-105%)}.side-title{font-size:18px;font-weight:800;margin:0 0 4px}.side-note{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.35}.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.num-btn{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:36px;font-weight:800;color:var(--ink);cursor:pointer;font-size:12px}.num-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}.num-btn.answered{background:var(--soft);border-color:#b8d6c7}.main{flex:1;margin-left:270px;transition:.25s ease;width:100%}.main.full{margin-left:0}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,232,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top-left{display:flex;align-items:center;gap:10px;min-width:0}.menu-btn{border:1px solid var(--line);background:#fffdf7;color:var(--ink);border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:800}.title-wrap{min-width:0}h1{font-size:20px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{color:var(--muted);font-size:13px;margin-top:2px}.progress-text{font-weight:800;font-size:14px;color:var(--brand-dark);white-space:nowrap}.content{max-width:900px;margin:0 auto;padding:26px 18px 36px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}.question-meta{color:var(--brand-dark);font-weight:900;margin-bottom:14px;font-size:15px}.question{font-size:20px;line-height:1.55;margin:0 0 10px;cursor:pointer;border-radius:12px;padding:6px}.question:hover{background:#f3ead6}.translation{display:none;margin:0 0 20px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;background:#fffdf7;color:#475569;line-height:1.5}.translation.show{display:block}.options{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:#fff;padding:14px 15px;border-radius:15px;cursor:pointer;font-size:16px;line-height:1.35;color:var(--ink);transition:.15s ease}.option.selected{background:var(--soft);border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,127,114,.12)}.letter{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eaf3ee;font-weight:900;flex:0 0 26px}.option.selected .letter{background:var(--brand);color:#fff}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.primary,.secondary{border:none;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff;min-width:130px}.secondary{background:#fffdf7;border:1px solid var(--line);color:var(--ink)}.hint{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.45}.overlay{position:fixed;inset:0;background:rgba(41,50,65,.36);z-index:15;display:none}.overlay.show{display:block}.result-head{text-align:center;margin-bottom:22px}.score{font-size:44px;font-weight:950;color:var(--brand-dark);margin:8px 0}.review-list{display:grid;gap:14px;margin-top:20px}.review-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.review-card.wrong{background:var(--wrong);border-color:#f2b8a8}.review-card.right{background:var(--right);border-color:#abd9bd}.review-title{font-weight:950;margin-bottom:8px}.review-q{line-height:1.45;margin-bottom:10px}.explain{color:#475569;font-size:14px;line-height:1.45;margin-top:8px}.small- </style></head><body><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><p class="side-title">Question Numbers</p><p class="side-note">Tap a number to go back. Green means answered.</p><div class="number-grid" id="numberGrid"></div></aside><main class="main" id="main"><div class="topbar"><div class="top-left"><button class="menu-btn" id="toggleSidebar">☰</button><div class="title-wrap"><h1>Fiqih Practice - Grade 2</h1><div class="subtitle">30 random HOTS questions from a varied 300-question bank. Click the question text for Indonesian help.</div></div></div><div class="progress-text" id="progressText">0/30 answered</div></div><div class="content"><section class="card" id="quizCard"></section></div></main><script>
const originalQuestions = [{"q": "Hasan prays Subuh in the prayer room. One person leads the prayer, and several people follow behind. What can Hasan conclude about this prayer?", "options": ["It is salat berjamaah", "It is salat alone", "It is only zikir"], "answer": "It is salat berjamaah", "explanation": "Salat berjamaah has an imam and makmum.", "id_q": "Bantuan Indonesia: Pahami ciri salat berjamaah, yaitu ada imam dan makmum yang mengikuti."}, {"q": "Dina arrives at Subuh prayer during ruku. Dina joins the row and follows the imam. Based on the situation, Dina is …", "options": ["masbuq", "muazin", "imam"], "answer": "masbuq", "explanation": "A makmum who comes late is called masbuq.", "id_q": "Bantuan Indonesia: Masbuq adalah makmum yang terlambat mengikuti salat berjamaah."}, {"q": "Aisyah is a female makmum. The imam forgets to sit. She wants to remind the imam without speaking. What should she do?", "options": ["clap her hands", "say Subhanallah loudly", "walk to the imam"], "answer": "clap her hands", "explanation": "A female makmum reminds the imam by clapping her hands.", "id_q": "Bantuan Indonesia: Makmum laki-laki mengucapkan Subhanallah, makmum perempuan menepuk tangan jika imam lupa."}, {"q": "Hamdan is a male makmum. The imam forgets something in salat. Hamdan wants to remind the imam correctly. What should Hamdan say?", "options": ["Subhanallah", "Alhamdulillah", "Astaghfirullah many times loudly"], "answer": "Subhanallah", "explanation": "A male makmum reminds the imam by saying Subhanallah.", "id_q": "Bantuan Indonesia: Makmum laki-laki mengucapkan Subhanallah, makmum perempuan menepuk tangan jika imam lupa."}, {"q": "A family wants to pray together. Teacher can read Al-Fatihah well and knows the prayer movements. The person who cannot read Al-Fatihah is not ready to lead. Who is more suitable to become imam?", "options": ["Teacher", "person who cannot read Al-Fatihah", "the person who plays first"], "answer": "Teacher", "explanation": "The imam should be able to lead prayer correctly.", "id_q": "Bantuan Indonesia: Imam dipilih dari orang yang paling mampu memimpin salat dengan baik."}, {"q": "In salat berjamaah, female students pray behind a female imam. What is the correct position?", "options": ["behind the imam", "in front of the imam", "outside the room"], "answer": "behind the imam", "explanation": "Makmum should stand in the correct position behind or beside the imam according to the rule.", "id_q": "Bantuan Indonesia: Posisi makmum bergantung pada jumlah makmum dan jenis kelamin."}, {"q": "During salat berjamaah, Raka bows before the imam bows. Based on the rule, this action should not be done by a makmum.", "options": ["should not be done by a makmum", "is the best action", "means zikir"], "answer": "should not be done by a makmum", "explanation": "A makmum follows the imam and keeps good adab.", "id_q": "Bantuan Indonesia: Makmum mengikuti imam dan tidak boleh mendahului gerakan imam."}, {"q": "Ahmad leads his family. Before salat, the intention in the heart should match praying as …", "options": ["imam", "all roles at once", "a person who is playing"], "answer": "imam", "explanation": "The intention must match the role in prayer.", "id_q": "Bantuan Indonesia: Niat harus sesuai peran salat, sebagai imam, makmum, atau sendiri."}, {"q": "After salat, Dani says 'Allahu Akbar' calmly. Which name matches this zikir reading?", "options": ["takbir", "tasbih", "adhan"], "answer": "takbir", "explanation": "'Allahu Akbar' is called takbir.", "id_q": "Bantuan Indonesia: Cocokkan istilah fikih dengan artinya."}, {"q": "After salat, Rayyan sits calmly and makes zikir. Rayyan does this to avoid useless talk after salat. Based on the story, zikir after salat is useful because it helps us …", "options": ["avoid useless talk after salat", "disturb friends", "forget Allah"], "answer": "avoid useless talk after salat", "explanation": "Zikir helps us avoid useless talk after salat.", "id_q": "Bantuan Indonesia: Zikir setelah salat adalah mengingat Allah dengan bacaan yang baik."}, {"q": "After salat, Rafi laughs loudly while friends are making zikir. Based on the story, should speak more softly.", "options": ["should speak more softly", "shows the best adab", "helps friends focus"], "answer": "should speak more softly", "explanation": "After salat, we should be calm and respectful.", "id_q": "Bantuan Indonesia: Setelah salat sebaiknya tenang, tidak mengganggu orang lain, dan menjaga adab."}, {"q": "Nabil wants to read a good doa after salat. Which sentence is an example of doa after salat?", "options": ["Rabbana atina fid-dunya hasanah", "playing a song loudly", "counting toys"], "answer": "Rabbana atina fid-dunya hasanah", "explanation": "This doa is for asking goodness in this world and the hereafter.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "After fardu prayer, Maryam raises both hands with palms facing up and asks Allah for goodness. Based on the lesson, this is …", "options": ["good adab of doa", "a game after salat", "a way to skip salat"], "answer": "good adab of doa", "explanation": "Doa should be done with good adab and humility.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "Choose the best pair. The students discuss who may become imam. Which pair is most suitable?", "options": ["has better Quran reading and is trusted by the makmum", "likes snacks and runs fast", "talks loudly and jokes during salat"], "answer": "has better Quran reading and is trusted by the makmum", "explanation": "An imam should have good prayer ability and good manners.", "id_q": "Bantuan Indonesia: Imam dipilih dari orang yang paling mampu memimpin salat dengan baik."}, {"q": "Choose the best pair. After salat, the class makes zikir together. Which pair shows good adab?", "options": ["focus on Allah and avoid joking", "shout and run", "laugh loudly and disturb friends"], "answer": "focus on Allah and avoid joking", "explanation": "Good zikir is calm, polite, and does not disturb others.", "id_q": "Bantuan Indonesia: Zikir setelah salat adalah mengingat Allah dengan bacaan yang baik."}, {"q": "The teacher gives a clue: 'glory be to Allah'. Which answer matches the clue?", "options": ["tasbih", "takbir", "tahmid"], "answer": "tasbih", "explanation": "The clue means tasbih.", "id_q": "Bantuan Indonesia: Cocokkan istilah fikih dengan artinya."}, {"q": "The statement is: 'A male makmum reminds the imam by clapping his hands.' Based on the lesson, the statement is …", "options": ["False", "True", "Not sure"], "answer": "False", "explanation": "Think about the rule and good adab.", "id_q": "Bantuan Indonesia: Tentukan benar atau salah dari aturan dan adab yang dipelajari."}, {"q": "Hana wants to pray Subuh alone, but then a friend asks to pray Isya together with an imam. If they pray together and follow the imam, the prayer becomes …", "options": ["salat berjamaah", "salat alone", "only doa"], "answer": "salat berjamaah", "explanation": "When people pray together with an imam, it is salat berjamaah.", "id_q": "Bantuan Indonesia: Pahami ciri salat berjamaah, yaitu ada imam dan makmum yang mengikuti."}, {"q": "Rizal comes before salat starts. Hana comes after the imam has started. Which child is masbuq?", "options": ["Hana", "Rizal", "both are imam"], "answer": "Hana", "explanation": "The child who comes late after the imam starts is masbuq.", "id_q": "Bantuan Indonesia: Masbuq adalah makmum yang terlambat mengikuti salat berjamaah."}, {"q": "An imam forgets during salat. Fikri says Subhanallah, while Humaira claps her hands. Based on the rule, their actions are …", "options": ["both correct according to their role", "both wrong", "only the girl is wrong"], "answer": "both correct according to their role", "explanation": "Male and female makmum have different ways to remind the imam.", "id_q": "Bantuan Indonesia: Makmum laki-laki mengucapkan Subhanallah, makmum perempuan menepuk tangan jika imam lupa."}, {"q": "Two people can lead salat. Akbar reads Quran better, but his friend wants to lead only because he wants to be first. Who should be chosen?", "options": ["the one who reads Quran better", "the one who wants to be first", "the one who jokes more"], "answer": "the one who reads Quran better", "explanation": "The imam should be chosen for ability and good adab.", "id_q": "Bantuan Indonesia: Imam dipilih dari orang yang paling mampu memimpin salat dengan baik."}, {"q": "Ahmad is the only makmum. He stands far behind the imam because he feels shy. What should he do?", "options": ["stand on the right side of the imam", "stay far behind alone", "stand in front of the imam"], "answer": "stand on the right side of the imam", "explanation": "One male makmum stands on the right side of the imam.", "id_q": "Bantuan Indonesia: Posisi makmum bergantung pada jumlah makmum dan jenis kelamin."}, {"q": "The imam says takbir to move. Bima waits, then follows. Another child moves before the imam. Which child shows the correct duty of makmum?", "options": ["Bima", "the child who moves before imam", "both children are wrong"], "answer": "Bima", "explanation": "A makmum should follow after the imam.", "id_q": "Bantuan Indonesia: Makmum mengikuti imam dan tidak boleh mendahului gerakan imam."}, {"q": "Rafi first plans to pray alone. Then Father asks Rafi to follow him as makmum. What should change in Rafi's intention?", "options": ["the intention should be as makmum", "the intention should be as imam", "the intention should be for playing"], "answer": "the intention should be as makmum", "explanation": "The intention follows the real role in salat.", "id_q": "Bantuan Indonesia: Niat harus sesuai peran salat, sebagai imam, makmum, atau sendiri."}, {"q": "A child says 'Subhanallah' after salat but does not know its zikir name. Which answer should the teacher give?", "options": ["tasbih", "tahmid", "iqamah"], "answer": "tasbih", "explanation": "'Subhanallah' is called tasbih.", "id_q": "Bantuan Indonesia: Cocokkan istilah fikih dengan artinya."}, {"q": "After salat, Dina has two choices: run outside quickly or sit for zikir first. Which choice is better?", "options": ["sit for zikir first", "run outside quickly", "disturb the row"], "answer": "sit for zikir first", "explanation": "Zikir after salat is a good habit to remember Allah.", "id_q": "Bantuan Indonesia: Zikir setelah salat adalah mengingat Allah dengan bacaan yang baik."}, {"q": "Nisa wants to ask Allah for useful knowledge after salat. Which doa is most suitable?", "options": ["Allahumma inni as'aluka ilman nafian", "Subhanallah", "Allahu Akbar"], "answer": "Allahumma inni as'aluka ilman nafian", "explanation": "This doa asks Allah for useful knowledge.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "Friends are still praying behind Ali. Ali wants to pass directly in front of them. What is the better action?", "options": ["wait or walk carefully without disturbing them", "run in front of them", "call them loudly"], "answer": "wait or walk carefully without disturbing them", "explanation": "Good adab means not disturbing people who pray.", "id_q": "Bantuan Indonesia: Setelah salat sebaiknya tenang, tidak mengganggu orang lain, dan menjaga adab."}, {"q": "A teacher asks, 'Who follows the imam in salat berjamaah?' Which answer is correct?", "options": ["makmum", "imam", "muazin"], "answer": "makmum", "explanation": "Makmum is the person who follows the imam.", "id_q": "Bantuan Indonesia: Cocokkan istilah fikih dengan artinya."}, {"q": "After salat, Nadia raises both hands with palms facing up and makes doa softly. Based on the story, the hand position is …", "options": ["good for making doa", "for playing only", "wrong because hands must be hidden"], "answer": "good for making doa", "explanation": "Raising hands with palms up is good adab when making doa.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "Khadijah prays Asar in the mosque. One person leads the prayer, and several people follow behind. What can Khadijah conclude about this prayer?", "options": ["It is salat berjamaah", "It is salat alone", "It is only zikir"], "answer": "It is salat berjamaah", "explanation": "Salat berjamaah has an imam and makmum.", "id_q": "Bantuan Indonesia: Pahami ciri salat berjamaah, yaitu ada imam dan makmum yang mengikuti."}, {"q": "Ali arrives at Magrib prayer during ruku. Ali joins the row and follows the imam. Based on the situation, Ali is …", "options": ["masbuq", "muazin", "imam"], "answer": "masbuq", "explanation": "A makmum who comes late is called masbuq.", "id_q": "Bantuan Indonesia: Masbuq adalah makmum yang terlambat mengikuti salat berjamaah."}, {"q": "Nisa is a female makmum. The imam forgets to sit. She wants to remind the imam without speaking. What should she do?", "options": ["clap her hands", "say Subhanallah loudly", "walk to the imam"], "answer": "clap her hands", "explanation": "A female makmum reminds the imam by clapping her hands.", "id_q": "Bantuan Indonesia: Makmum laki-laki mengucapkan Subhanallah, makmum perempuan menepuk tangan jika imam lupa."}, {"q": "Yusuf is a male makmum. The imam stands too early. Yusuf wants to remind the imam correctly. What should Yusuf say?", "options": ["Subhanallah", "Alhamdulillah", "Astaghfirullah many times loudly"], "answer": "Subhanallah", "explanation": "A male makmum reminds the imam by saying Subhanallah.", "id_q": "Bantuan Indonesia: Makmum laki-laki mengucapkan Subhanallah, makmum perempuan menepuk tangan jika imam lupa."}, {"q": "A family wants to pray together. Older brother can read Al-Fatihah well and knows the prayer movements. The person who jokes in prayer is not ready to lead. Who is more suitable to become imam?", "options": ["Older brother", "person who r": "avoid useless talk after salat", "explanation": "Zikir helps us avoid useless talk after salat.", "id_q": "Bantuan Indonesia: Zikir setelah salat adalah mengingat Allah dengan bacaan yang baik."}, {"q": "After salat, Fina shouts near friends who are praying. Based on the story, should stop and be quiet.", "options": ["should stop and be quiet", "shows good manners", "helps the imam"], "answer": "should stop and be quiet", "explanation": "After salat, we should be calm and respectful.", "id_q": "Bantuan Indonesia: Setelah salat sebaiknya tenang, tidak mengganggu orang lain, dan menjaga adab."}, {"q": "Hafiz wants to read a good doa after salat. Which sentence is an example of doa after salat?", "options": ["Allahumma inni as'aluka ilman nafian", "playing a song loudly", "counting toys"], "answer": "Allahumma inni as'aluka ilman nafian", "explanation": "This doa is for asking for useful knowledge.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "After fardu prayer, Ahmad raises both hands with palms facing up and asks Allah for goodness. Based on the lesson, this is …", "options": ["good adab of doa", "a game after salat", "a way to skip salat"], "answer": "good adab of doa", "explanation": "Doa should be done with good adab and humility.", "id_q": "Bantuan Indonesia: Doa setelah salat dilakukan dengan adab baik dan memohon kebaikan kepada Allah."}, {"q": "The teacher gives a clue: 'praise be to Allah'. Which answer matches the clue?", "options": ["tahmid", "tasbih", "takbir"], "answer": "tahmid", "explanation": "The clue means tahmid.", "id_q": "Bantuan Indonesia: Cocokkan istilah fikih dengan artinya."}, {"q": "The statement is: 'Zikir should be done loudly to disturb friends.' Based on the lesson, the statement is …", "options": ["False", "True", "Not sure"], "answer": "False", "explanation": "Think about the rule and good adab.", "id_q": "Bantuan Indonesia: Tentukan benar atau salah dari a const QUESTIONS_PER_SESSION=30;let questions=[];let currentIndex=0;let answers={};let finished=false;
function shuffle(array){const arr=[...array];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startQuiz(){questions=shuffle(originalQuestions).slice(0,QUESTIONS_PER_SESSION).map(item=>({...item,options:shuffle(item.options)}));currentIndex=0;answers={};finished=false;renderNumbers();renderQuestion();updateProgress()}
function renderNumbers(){const grid=document.getElementById("numberGrid");grid.innerHTML="";questions.forEach((item,i)=>{const btn=document.createElement("button");btn.className="num-btn";btn.textContent=i+1;if(i===currentIndex)btn.classList.add("active");if(answers[i])btn.classList.add("answered");btn.onclick=()=>{currentIndex=i;renderQuestion();renderNumbers();closeSidebarOnMobile()};grid.appendChild(btn)})}
function updateProgress(){const count=Object.keys(answers).length;document.getElementById("progressText").textContent=`${count}/${questions.length} answered`}
function allAnswered(){return Object.keys(answers).length===questions.length}
function renderQuestion(){if(finished){renderResult();return}const item=questions[currentIndex];const selected=answers[currentIndex];const card=document.getElementById("quizCard");const nextLabel=allAnswered()?"Finish":(currentIndex===questions.length-1?"Check":"Next");card.innerHTML=`<div class="question-meta">Question ${currentIndex+1} of ${questions.length}</div><p class="question" id="questionText" title="Click to show Indonesian help">${item.q}</p><div class="translation" id="translationBox">${item.id_q || ""}</div><div class="options">${item.options.map((opt,idx)=>`<button class="option ${selected===opt?"selected":""}" data-option="${escapeHtml(opt)}"><span class="letter">${String.fromCharCode(65+idx)}</span><span>${opt}</span></button>`).join("")}</div><div class="actions"><button class="secondary" id="prevBtn">${currentIndex===0?"First":"Back"}</button><button class="primary" id="nextBtn">${nextLabel}</button></div><div class="hint">Click the question text for Indonesian help. Finish appears after all questions are answered.</div>`;const questionText=document.getElementById("questionText");const translationBox=document.getElementById("translationBox");questionText.onclick=()=>translationBox.classList.toggle("show");document.querySelectorAll(".option").forEach(btn=>{btn.onclick=()=>{answers[currentIndex]=btn.dataset.option;renderQuestion();renderNumbers();updateProgress()}});document.getElementById("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;renderQuestion();renderNumbers()}};document.getElementById("nextBtn").onclick=()=>{if(allAnswered()){finished=true;renderResult();renderNumbers();return}if(currentIndex<questions.length-1){currentIndex++}else{const firstUnanswered=questions.findIndex((_,i)=>!answers[i]);if(firstUnanswered!==-1)currentIndex=firstUnanswered}renderQuestion();renderNumbers()}}
function renderResult(){const results=questions.map((item,i)=>({number:i+1,q:item.q,selected:answers[i],correct:item.answer,ok:answers[i]===item.answer,explanation:item.explanation}));const correctCount=results.filter(r=>r.ok).length;const wrongFirst=[...results].sort((a,b)=>Number(a.ok)-Number(b.ok));const card=document.getElementById("quizCard");card.innerHTML=`<div class="result-head"><div class="question-meta">Result</div><div class="score">${correctCount}/${questions.length}</div><p class="subtitle">Wrong answers are shown first so you can learn them again.</p></div><div class="review-list">${wrongFirst.map(r=>`<div class="review-card ${r.ok?"right":"wrong"}"><div class="review-title">${r.ok?"Correct":"Need Practice"} - Question ${r.number}</div><div class="review-q">${r.q}</div><div><span class="small-label">Your answer:</span> ${r.selected||"-"}</div>${r.ok?"":`<div><span class="small-label">Correct answer:</span> ${r.correct}</div>`}<div class="explain">${r.explanation}</div></div>`).join("")}</div>`}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
const sidebar=document.getElementById("sidebar"),main=document.getElementById("main"),overlay=document.getElementById("overlay"),toggleSidebar=document.getElementById("toggleSidebar");function isMobile(){return window.matchMedia("(max-width: 760px)").matches}function openSidebar(){if(isMobile()){sidebar.classList.add("show");sidebar.classList.remove("hidden");overlay.classList.add("show")}else{sidebar.classList.remove("hidden");main.classList.remove("full")}}function closeSidebar(){if(isMobile()){sidebar.classList.remove("show");sidebar.classList.add("hidden");overlay.classList.remove("show")}else{sidebar.classList.add("hidden");main.classList.add("full")}}function closeSidebarOnMobile(){if(isMobile())closeSidebar()}toggleSidebar.onclick=()=>{const mobileOpen=sidebar.classList.contains("show");const desktopHidden=sidebar.classList.contains("hidden")&&!isMobile();if(isMobile()){mobileOpen?closeSidebar():openSidebar()}else{desktopHidden?openSidebar():closeSidebar()}};overlay.onclick=closeSidebar;window.addEventListener("resize",()=>{overlay.classList.remove("show");if(isMobile()){sidebar.classList.remove("show");sidebar.classList.add("hidden");main.classList.add("full")}else{sidebar.classList.remove("show");sidebar.classList.remove("hidden");main.classList.remove("full")}});startQuiz();
